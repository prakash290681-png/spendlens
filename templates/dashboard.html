<!DOCTYPE html>
<html>
<head>
  <title>SpendLens Dashboard</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    .card { border: 1px solid #ddd; padding: 16px; margin-top: 16px; width: 500px; }
    .exceeded { color: red; }
    .warning { color: orange; }
  </style>
</head>
<body>

<h2 style="color:red;">DASHBOARD VERSION: 2026-01-ALERTS-FIX</h2>

<h1>SpendLens</h1>
<p>Your spending summary (current month)</p>

<div class="card" id="summary">Loading summary...</div>
<div class="card" id="alerts">Loading alerts...</div>

<!-- DASHBOARD VERSION: 2026-01-SINGLE-SCRIPT -->

<script>
async function loadDashboard() {
  console.log("🚀 Dashboard loading started");

  // ---------- SUMMARY ----------
  try {
    console.log("➡️ Fetching summary...");
    const summaryRes = await fetch("/summary/monthly");
    console.log("⬅️ Summary response status:", summaryRes.status);

    const text = await summaryRes.text();
    console.log("📦 Summary raw response:", text);

    const summary = JSON.parse(text);

    document.getElementById("summary").innerHTML = "✅ Summary loaded";
  } catch (e) {
    console.error("❌ Summary error:", e);
    document.getElementById("summary").innerHTML = "⚠️ Summary failed";
  }

  // ---------- ALERTS ----------
  try {
    console.log("➡️ Fetching alerts...");
    const alertsRes = await fetch("/alerts/monthly");
    console.log("⬅️ Alerts response status:", alertsRes.status);

    const text = await alertsRes.text();
    console.log("📦 Alerts raw response:", text);

    const alertsData = JSON.parse(text);

    document.getElementById("alerts").innerHTML = "✅ Alerts loaded";
  } catch (e) {
    console.error("❌ Alerts error:", e);
    document.getElementById("alerts").innerHTML = "⚠️ Alerts failed";
  }
}

document.addEventListener("DOMContentLoaded", loadDashboard);
</script>

</body>
</html>
