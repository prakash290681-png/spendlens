<!DOCTYPE html>
<html>
<head>
  <title>SpendLens Dashboard</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    .card { border: 1px solid #ddd; padding: 16px; margin-top: 16px; width: 500px; }
    .exceeded { color: red; }
    .warning { color: orange; }
  </style>
</head>
<body>

<h2 style="color:red;">DASHBOARD VERSION: FORCE-RELOAD-TEST</h2>


<h1>SpendLens</h1>
<p>Your spending summary (current month)</p>

<div class="card" id="summary">Loading summary...</div>
<div class="card" id="alerts">Loading alerts...</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const summary = document.getElementById("summary");
  const alerts = document.getElementById("alerts");

  if (summary) summary.innerHTML = "✅ JS is running";
  if (alerts) alerts.innerHTML = "✅ Alerts loaded";
});
</script>


</body>
</html>
