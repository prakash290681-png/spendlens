<!DOCTYPE html>
<html>
<head>
    <title>SpendLens Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .card {
            border: 1px solid #ddd;
            padding: 16px;
            margin-top: 16px;
            width: 500px;
        }
        .warning { color: orange; }
        .exceeded { color: red; }
    </style>
</head>
<body>

<h1>SpendLens</h1>
<p>Your spending summary (current month)</p>

<div class="card" id="summary">Loading summary...</div>
<div class="card" id="alerts">Loading alerts...</div>

<script>
async function loadSummary() {
    const res = await fetch("/summary/monthly");
    const data = await res.json();

    const div = document.getElementById("summary");

    div.innerHTML = `
        <h3>Total Spend (This Month)</h3>
        <p style="font-size:24px;"><strong>₹ ${data.total_spent}</strong></p>
    `;
}

async function loadAlerts() {
    const res = await fetch("/alerts/monthly");

    if (!res.ok) {
        document.getElementById("alerts").innerHTML =
            "<h3>Budget Alerts</h3>⚠️ Alerts not configured yet.";
        return;
    }

    const data = await res.json();
    document.getElementById("alerts").innerHTML =
        "<h3>Budget Alerts</h3>✅ No alerts yet.";
}

loadSummary();
loadAlerts();
</script>
</body>
</html>
