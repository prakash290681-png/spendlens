<!DOCTYPE html>
<html>
<head>
    <title>SpendLens Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .card {
            border: 1px solid #ddd;
            padding: 16px;
            margin-top: 16px;
            width: 500px;
        }
        .warning { color: orange; }
        .exceeded { color: red; }
    </style>
</head>
<body>

<h1>SpendLens</h1>
<p>Your spending summary (current month)</p>

<div class="card" id="summary">Loading summary...</div>
<div class="card" id="alerts">Loading alerts...</div>

<script>
async function loadSummary() {
    const res = await fetch("/summary/monthly");
    const data = await res.json();

    const div = document.getElementById("summary");

    let html = `
        <h3>Total Spend (This Month)</h3>
        <p style="font-size:24px;"><strong>₹ ${data.total_spent}</strong></p>
    `;

    if (data.by_category && data.by_category.length > 0) {
        html += "<h4>Category Breakdown</h4><ul>";
        data.by_category.forEach(item => {
            html += `<li>${item.category}: ₹ ${item.total}</li>`;
        });
        html += "</ul>";
    }

    if (data.by_merchant && data.by_merchant.length > 0) {
        html += "<h4>Merchant Breakdown</h4><ul>";
        data.by_merchant.forEach(item => {
            html += `<li>${item.merchant}: ₹ ${item.total}</li>`;
        });
        html += "</ul>";
    }

    div.innerHTML = html;
}

async function loadAlerts() {
    const res = await fetch("/alerts/monthly");
    const data = await res.json();

    const alertsDiv = document.getElementById("alerts");

    if (!data.alerts || data.alerts.length === 0) {
        alertsDiv.innerHTML = "<p>✅ No budget alerts this month</p>";
        return;
    }

    alertsDiv.innerHTML = data.alerts.map(a => `
        <div style="
            padding: 10px;
            margin-bottom: 10px;
            border-left: 6px solid ${a.status === "exceeded" ? "red" : "orange"};
            background: #f9f9f9;
        ">
            <strong>${a.category}</strong><br/>
            Spent ₹${a.spent} / ₹${a.limit}<br/>
            ${a.percent}% used
        </div>
    `).join("");
}

loadSummary();
loadAlerts();
</script>
