<!DOCTYPE html>
<html>
<head>
  <title>SpendLens Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; margin: 40px; }
    .layout { display:flex; gap:20px; align-items:flex-start; }
    .card { border:1px solid #ddd; padding:16px; margin-top:16px; }
    .insight-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      line-height: 1.4;
    }  
   
  </style>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#111827">

</head>

<body>

<h1>SpendLens</h1>

<div style="margin-bottom: 10px;">
  <label><b>Select Month:</b></label>
  <input type="month" id="monthPicker">
</div>

<p id="month-label"></p>

<div class="layout">

  <div style="flex:1; min-width:350px;">
    <div class="card" id="summary">Loading summary...</div>
    <div class="card" id="alerts">Loading alerts...</div>
    <div class="card" id="aiInsights">Generating insights...</div>
  </div>

  <div style="flex:1.3; min-width:350px;">
    <div class="card">
      <h3>Spend by Category</h3>
      <div style="height:240px;">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h3>Spend by Merchant</h3>
      <div style="height:240px;">
        <canvas id="merchantChart"></canvas>
      </div>
    </div>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  async function api(url) {
    const res = await fetch(url, {
      credentials: "same-origin",
      cache: "no-store"
    });

    if (res.status === 401) {
      window.location.href = "/auth/login";
      return null;
    }
    return res.json();
  }

  const picker = document.getElementById("monthPicker");
  const label = document.getElementById("month-label");
  const summaryDiv = document.getElementById("summary");
  const alertsDiv = document.getElementById("alerts");
  const aiDiv = document.getElementById("aiInsights");

  let categoryChart = null;
  let merchantChart = null;
  let requestCounter = 0;


  let activeMonthRequest = null;

  function formatLabel(monthStr) {
    const [y, m] = monthStr.split("-");
    const d = new Date(y, m - 1, 1);
    return d.toLocaleString("default", { month: "long", year: "numeric" });
  }

  function resetCharts() {
    if (categoryChart) {
      categoryChart.destroy();
      categoryChart = null;
    }
    if (merchantChart) {
      merchantChart.destroy();
      merchantChart = null;
    }

    const catCtx = document.getElementById("categoryChart").getContext("2d");
    const merCtx = document.getElementById("merchantChart").getContext("2d");

    catCtx.clearRect(0, 0, 1000, 1000);
    merCtx.clearRect(0, 0, 1000, 1000);
  }

  async function load(month) {

  const requestId = ++requestCounter;

  // Reset UI immediately
  summaryDiv.innerHTML = "Loading summary...";
  alertsDiv.innerHTML = "Loading alerts...";
  aiDiv.innerHTML = "Generating insights...";
  resetCharts();

  label.innerText = `Your spending summary (${formatLabel(month)})`;

  // ---------------- summary ----------------
  const summary = await api(`/summary/monthly?month=${month}`);
  if (requestId !== requestCounter) return;
  if (!summary) return;
  
  if (summary.total_spent === 0) {
    setTimeout(() => {
      if (requestId === requestCounter) load(month);
    }, 3000);
  }

  summaryDiv.innerHTML = `
    <h3>Total Spend</h3>
    <p style="font-size:24px;"><strong>₹ ${summary.total_spent}</strong></p>
  `;

  // charts
  categoryChart = new Chart(
    document.getElementById("categoryChart"),
    {
      type: "doughnut",
      data: {
        labels: summary.by_category.map(c => c.category),
        datasets: [{
          data: summary.by_category.map(c => c.total)
        }]
      }
    }
  );

  merchantChart = new Chart(
    document.getElementById("merchantChart"),
    {
      type: "bar",
      data: {
        labels: summary.by_merchant.map(m => m.merchant),
        datasets: [{
          data: summary.by_merchant.map(m => m.total)
        }]
      }
    }
  );

  // ---------------- alerts ----------------
  const alertData = await api(`/alerts/monthly?month=${month}`);
  if (requestId !== requestCounter) return;

  alertsDiv.innerHTML =
    !alertData || alertData.alerts.length === 0
      ? "✅ No budget alerts"
      : alertData.alerts.map(a => {
          const percent = Number(a.percent || 0);
          const over = Number(a.over_by ?? percent - 100);

          return `
            <div style="margin-bottom:8px;">
              <strong>${a.category}</strong> ₹${a.spent}/${a.limit} (${percent}%)
              ${
                a.status === "exceeded"
                  ? `<div style="color:#d32f2f;">⚠️ You exceeded the budget by ${over.toFixed(1)}%</div>`
                  : `<div style="color:#b26a00;">Heads up — nearing limit</div>`
              }
            </div>
          `;
        }).join("");  
    

  // ---------------- AI ----------------
  try {
    const ai = await api(`/insights/ai?month=${month}`);
    if (requestId !== requestCounter) return;

    aiDiv.innerHTML =
      !ai || ai.length === 0
        ? "No insights yet."
        : ai.slice(0,3).map(i => `<div class="insight-item">💡 ${i}</div>`).join("");

  } catch {
    if (requestId !== requestCounter) return;
    aiDiv.innerHTML = "No insights yet.";
  }
}


  const today = new Date();
  const defaultMonth =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0");

  picker.value = defaultMonth;

  await load(defaultMonth);

  picker.addEventListener("change", async (e) => {
    await load(e.target.value);
  });

});
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/sw.js")
    .then(() => console.log("SW registered"))
    .catch(err => console.log("SW failed", err));
}
</script>

</body>
</html>
