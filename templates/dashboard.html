<!DOCTYPE html>
<html>
<head>
  <title>SpendLens Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; margin: 40px; }
    .layout { display:flex; gap:20px; align-items:flex-start; }
    .card { border:1px solid #ddd; padding:16px; margin-top:16px; border-radius:10px; }
    .insight-item { padding:8px 0; border-bottom:1px solid #eee; }
    #score-value { font-size:42px; margin:10px 0; }
    #score-label { font-weight:bold; margin-bottom:5px; }
    #premium-box { background:#f9fafb; border:1px dashed #bbb; }
    .premium-locked { color:#888; font-style:italic; }
  </style>
</head>

<body>

<h1>SpendLens</h1>

<div style="margin-bottom:10px;">
  <label><b>Select Month:</b></label>
  <input type="month" id="monthPicker">
</div>

<p id="month-label"></p>

<div class="layout">

  <!-- LEFT COLUMN -->
  <div style="flex:1; min-width:350px;">
    <div class="card" id="summary">Loading summary...</div>
    <div class="card" id="alerts">Loading alerts...</div>
    <div class="card" id="aiInsights">Generating insights...</div>

    <div class="card">
      <h3>SpendLens Score</h3>
      <div id="score-value">--</div>
      <div id="score-label"></div>
      <div id="score-description"></div>
      <ul id="score-summary"></ul>
    </div>

    <div class="card" id="premium-box">
      <h3>🔒 Premium Feature – Improve Your Score</h3>
      <div id="improvement-list" class="premium-locked">
        Upgrade to Premium to unlock personalized improvement suggestions.
      </div>
    </div>
  </div>

  <!-- RIGHT COLUMN -->
  <div style="flex:1.3; min-width:350px;">

    <div class="card">
      <h3>Spend by Category</h3>
      <div style="height:220px; position:relative;">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h3>Spend by Merchant</h3>
      <div style="height:220px; position:relative;">
        <canvas id="merchantChart"></canvas>
      </div>
    </div>

  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  async function api(url) {
    const res = await fetch(url, {
      credentials: "same-origin",
      cache: "no-store"
    });

    if (res.status === 401) {
      window.location.href = "/auth/login";
      return null;
    }
    return res.json();
  }

  const picker = document.getElementById("monthPicker");
  const label = document.getElementById("month-label");
  const summaryDiv = document.getElementById("summary");
  const alertsDiv = document.getElementById("alerts");
  const aiDiv = document.getElementById("aiInsights");

  let categoryChart = null;
  let merchantChart = null;

  let retryAttempts = 0;
  const MAX_RETRIES = 5;

  function formatLabel(monthStr) {
    const [y, m] = monthStr.split("-");
    const d = new Date(y, m - 1, 1);
    return d.toLocaleString("default", { month: "long", year: "numeric" });
  }

  function resetCharts() {
    if (categoryChart) categoryChart.destroy();
    if (merchantChart) merchantChart.destroy();
  }

  async function load(month) {

    summaryDiv.innerHTML = "Loading summary...";
    alertsDiv.innerHTML = "Loading alerts...";
    aiDiv.innerHTML = "Generating insights...";
    resetCharts();

    document.getElementById("score-value").innerText = "Calculating...";
    document.getElementById("score-label").innerText = "";
    document.getElementById("score-description").innerText = "";
    document.getElementById("score-summary").innerHTML = "";

    label.innerText = `Your spending summary (${formatLabel(month)})`;

    const summary = await api(`/summary/monthly?month=${month}`);
    if (!summary) return;

    if (summary.status === "loading" && retryAttempts < MAX_RETRIES) {
        retryAttempts++;
        summaryDiv.innerHTML = "Preparing your dashboard...";
        setTimeout(() => load(month), 1500);
        return;
    }

    retryAttempts = 0;
    
    summaryDiv.innerHTML = `
      <h3>Total Spend</h3>
      <p style="font-size:24px;"><strong>₹ ${summary.total_spent || 0}</strong></p>
    `;

    if (summary.total_spent > 0) {

      categoryChart = new Chart(document.getElementById("categoryChart"), {
        type: "doughnut",
        data: {
          labels: summary.by_category.map(c => c.category),
          datasets: [{ data: summary.by_category.map(c => c.total) }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });

      merchantChart = new Chart(document.getElementById("merchantChart"), {
        type: "bar",
        data: {
          labels: summary.by_merchant.map(m => m.merchant),
          datasets: [{ data: summary.by_merchant.map(m => m.total) }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });

    }

    const alertData = await api(`/alerts/monthly?month=${month}`);
    alertsDiv.innerHTML =
      !alertData || alertData.alerts.length === 0
        ? "✅ No budget alerts"
        : alertData.alerts.map(a => {
            const percent = Number(a.percent || 0);
            const over = Number(a.over_by || 0);

            return `
              <div style="margin-bottom:8px;">
                <strong>${a.category}</strong>
                ₹${a.spent}/${a.limit} (${percent}%)
                ${
                  a.status === "exceeded"
                    ? `<div style="color:#d32f2f;">⚠️ You exceeded the budget by ${over}%</div>`
                    : `<div style="color:#b26a00;">Heads up — nearing budget limit</div>`
                }
              </div>
            `;
          }).join("");

        const ai = await api(`/insights/ai?month=${month}`);
    aiDiv.innerHTML =
      !ai || ai.length === 0
        ? "No insights yet."
        : ai.slice(0,3).map(i =>
            `<div class="insight-item">💡 ${i}</div>`
          ).join("");

    await loadScore(month);
  }

  async function loadScore(month) {
    const data = await api(`/insights/score?month=${month}`);
    if (!data || data.score === undefined) return;

    const scoreValue = document.getElementById("score-value");
    const labelDiv = document.getElementById("score-label");
    const descDiv = document.getElementById("score-description");
    const summaryList = document.getElementById("score-summary");
    const improvementDiv = document.getElementById("improvement-list");

    scoreValue.innerText = data.score + "/100";
    scoreValue.style.color =
      data.score >= 80 ? "green" :
      data.score >= 60 ? "orange" : "red";

    labelDiv.innerText = data.rating?.label || "";
    descDiv.innerText = data.rating?.description || "";

    summaryList.innerHTML = "";
    data.summary?.forEach(msg => {
      const li = document.createElement("li");
      li.innerText = msg;
      summaryList.appendChild(li);
    });

    if (data.improvements?.length > 0) {
      improvementDiv.classList.remove("premium-locked");
      improvementDiv.innerHTML = data.improvements.map(item => `
        <div>
          <strong>${item.area}</strong><br>
          ${item.suggestion}<br>
          <span style="color:green;">+${item.impact} possible points</span>
        </div>
      `).join("");
    }
  }

  // Fire sync in background
  fetch("/sync", { method: "POST", credentials: "same-origin" });

  const today = new Date();
  const defaultMonth =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0");

  picker.value = defaultMonth;
  load(defaultMonth);

  picker.addEventListener("change", e => {
    load(e.target.value);
  });

});
</script>

</body>
</html>
