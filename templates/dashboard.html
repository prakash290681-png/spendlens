<!DOCTYPE html>
<html>
<head>
  <title>SpendLens Dashboard</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    .card { border: 1px solid #ddd; padding: 16px; margin-top: 16px; width: 500px; }
    .exceeded { color: red; }
    .warning { color: orange; }
  </style>
</head>
<body>

<h2 style="color:red;">DASHBOARD VERSION: FORCE-RELOAD-TEST</h2>


<h1>SpendLens</h1>
<p>Your spending summary (current month)</p>

<div class="card" id="summary">Loading summary...</div>
<div class="card" id="alerts">Loading alerts...</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const alertsDiv = document.getElementById("alerts");

  try {
    const res = await fetch("/alerts/monthly");
    const data = await res.json();

    if (!data.alerts || data.alerts.length === 0) {
      alertsDiv.innerHTML = "✅ No budget alerts";
      return;
    }

    alertsDiv.innerHTML = data.alerts.map(a => `
      <div>
        <strong>${a.category}</strong><br/>
        Spent ₹${a.spent} / ₹${a.limit} (${a.percent}%)
      </div>
    `).join("");
  } catch (e) {
    alertsDiv.innerHTML = "⚠️ Failed to load alerts";
  }
});
</script>


</body>
</html>
