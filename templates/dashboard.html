<!DOCTYPE html>
<html>
<head>
  <title>SpendLens Dashboard</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    .card { border: 1px solid #ddd; padding: 16px; margin-top: 16px; width: 500px; }
    .exceeded { color: red; }
    .warning { color: orange; }
  </style>
</head>
<body>

<h1>SpendLens</h1>
<p id="month-label"></p>

<div class="card" id="summary">Loading summary...</div>
<div class="card" id="alerts">Loading alerts...</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const now = new Date();
  const monthName = now.toLocaleString("default", { month: "long" });
  const year = now.getFullYear();

  document.getElementById("month-label").innerText =
    `Your spending summary (${monthName} ${year})`;

  // -------- SUMMARY --------
  const summaryDiv = document.getElementById("summary");

  try {
    const summaryRes = await fetch("/summary/monthly");
    const summary = await summaryRes.json();

    summaryDiv.innerHTML = `
      <h3>Total Spend</h3>
      <p style="font-size:24px;"><strong>₹ ${summary.total_spent}</strong></p>
      <h4>By Merchant</h4>
      <ul>
        ${(summary.by_merchant || []).map(m =>
          `<li>${m.merchant}: ₹ ${m.total}</li>`
        ).join("")}
      </ul>
    `;
  } catch {
    summaryDiv.innerHTML = "⚠️ Failed to load summary";
  }

  // -------- ALERTS --------
  const alertsDiv = document.getElementById("alerts");

  try {
    const alertsRes = await fetch("/alerts/monthly");
    const data = await alertsRes.json();

    if (!data.alerts || data.alerts.length === 0) {
      alertsDiv.innerHTML = "✅ No budget alerts";
      return;
    }

    alertsDiv.innerHTML = `
      <h3>⚠️ Budget Alerts</h3>
      ${data.alerts.map(a => `
        <div style="margin-top:10px;">
          <strong>${a.category}</strong><br/>
          Spent ₹${a.spent} / ₹${a.limit} (${a.percent}%)
        </div>
      `).join("")}
    `;
  } catch {
    alertsDiv.innerHTML = "⚠️ Failed to load alerts";
  }
});
</script>

</body>
</html>
